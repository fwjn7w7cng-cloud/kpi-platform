# Вопросы и уроки демо-фирмы. У настоящего клиента сюда кладут вопросы по его продукции и правилам.
# a — варианты ответа: ПЕРВЫЙ всегда правильный (бот сам перемешивает).

questions:
  - {topic: "Показатели", q: "Что такое АКБ?", a: ["Клиенты, купившие за месяц от порога суммы", "Все клиенты в базе 1С", "Клиенты без долга", "Новые клиенты месяца"]}
  - {topic: "Показатели", q: "Порог АКБ в нашей компании — от какой суммы покупок за месяц?", a: ["5 000 ₽", "1 000 ₽", "10 000 ₽", "Любая покупка"]}
  - {topic: "Показатели", q: "SKU в точке — это…", a: ["Сколько разных групп товаров взял клиент", "Сколько штук товара продано", "Сколько точек в маршруте", "Сумма заказа"]}
  - {topic: "Показатели", q: "План выполнен на 80% при пройденной половине месяца. Это…", a: ["Хорошо — идём выше графика", "Плохо — отстаём", "Ровно по графику", "Нельзя сказать"]}
  - {topic: "Долги", q: "Просрочка 60+ — это долг старше…", a: ["60 дней", "30 дней", "6 месяцев", "1 недели"]}
  - {topic: "Долги", q: "Что сделать первым делом, если у клиента просрочка 30+?", a: ["Договориться о дате оплаты до нового заказа", "Дать скидку побольше", "Ничего, он сам заплатит", "Перестать к нему ездить"]}
  - {topic: "Долги", q: "За что удерживают 3 000 ₽ из зарплаты?", a: ["Просрочка 60+ больше 10% от продаж", "За любой долг клиента", "За возврат товара", "За опоздание"]}
  - {topic: "Маршрут", q: "Когда формировать отчёт за день в боте?", a: ["Вечером, после последней точки", "Утром перед выездом", "Раз в неделю", "Только если были продажи"]}
  - {topic: "Маршрут", q: "Клиент закрыт, когда вы приехали. Что отметить в маршруте?", a: ["❌ Не был — причина «Закрыто»", "✅ Продал", "👋 Был, без заказа", "Ничего не отмечать"]}
  - {topic: "Работа с клиентом", q: "Клиент перестал брать группу, которую брал два месяца. Что делать?", a: ["Спросить почему и предложить снова", "Ничего, это его выбор", "Сразу дать максимальную скидку", "Передать клиента коллеге"]}
  - {topic: "Работа с клиентом", q: "Где в боте увидеть, кто из клиентов «заснул»?", a: ["😴 Клиенты → Спящие", "💰 Зарплата", "🏆 Рейтинг", "📅 Табель"]}
  - {topic: "Работа с клиентом", q: "Фокусные группы — это…", a: ["Группы товаров, которые компания продвигает в этом месяце", "Самые дешёвые товары", "Товары без остатка", "Товары с наибольшей скидкой"]}
  - {topic: "Зарплата", q: "Как считается оклад, если отработано 20 дней из 26?", a: ["Оклад ÷ 26 × 20", "Весь оклад", "Половина оклада", "Оклад × 20"]}
  - {topic: "Зарплата", q: "Где посмотреть, сколько уже заработано в этом месяце?", a: ["💰 Зарплата в боте", "Только у бухгалтера", "В 1С", "Нигде до конца месяца"]}
  - {topic: "Правила", q: "Опоздание на 35 минут — какой штраф по табелю?", a: ["200 ₽", "100 ₽", "300 ₽", "Без штрафа"]}

lessons:
  - title: "Как устроен наш день"
    text: |
      Утром бот присылает маршрут: точки на сегодня, кто сколько брал и у кого долг.
      В течение дня отмечайте каждую точку: ✅ продал, 👋 был без заказа, ❌ не был с причиной.
      Вечером нажмите «📋 Сформировать отчёт» — он уйдёт вашему супервайзеру.
      Если что-то в боте не работает — кнопка «🐞 Не работает», администратор ответит.
    questions:
      - {q: "Куда уходит отчёт за день?", a: ["Супервайзеру и руководителю продаж", "Директору в 1С", "Никуда, хранится у вас", "Бухгалтеру"]}
      - {q: "Что отметить, если клиента не было на месте?", a: ["❌ Не был — «Нет на месте»", "✅ Продал", "Ничего", "👋 Был, без заказа"]}
      - {q: "Где сообщить, что кнопка в боте не работает?", a: ["🐞 Не работает", "📅 Табель", "🏆 Рейтинг", "Нигде"]}
  - title: "Наши показатели"
    text: |
      Продажи — сумма отгрузок за месяц, возвраты вычитаются.
      АКБ — клиенты, купившие за месяц от 5 000 ₽. Чем больше АКБ, тем стабильнее продажи.
      SKU в точках — сколько разных групп товаров взял каждый клиент.
      Фокусные группы — товары, которые компания продвигает в этом месяце; за них отдельный бонус.
      «Нужно к сегодня» — какая доля плана должна быть выполнена по прошедшим рабочим дням.
    questions:
      - {q: "Клиент купил на 3 000 ₽ за месяц. Он в АКБ?", a: ["Нет, порог 5 000 ₽", "Да", "Только если без долга", "Да, если купил дважды"]}
      - {q: "Что вычитается из продаж?", a: ["Возвраты", "Скидки", "Долги", "Доставка"]}
      - {q: "За что отдельный бонус?", a: ["За фокусные группы", "За любые товары", "За количество поездок", "За долги"]}
  - title: "Долги и деньги"
    text: |
      Товар отгружен — это ещё не деньги. Деньги — когда клиент заплатил.
      Просрочка 30+ — первый звонок: договоритесь о дате оплаты.
      Просрочка 60+ больше 10% от ваших продаж — удержание из зарплаты.
      Новый заказ должнику — только после договорённости об оплате.
    questions:
      - {q: "Когда отгрузка становится деньгами?", a: ["Когда клиент заплатил", "Сразу при отгрузке", "В конце месяца", "Когда подписана накладная"]}
      - {q: "Просрочка 60+ — 12% от продаж. Что будет?", a: ["Удержание из зарплаты", "Ничего", "Бонус", "Предупреждение без денег"]}
  - title: "Зарплата и табель"
    text: |
      Зарплата: оклад за отработанные дни + % от продаж + бонусы за план, АКБ и фокус − удержания.
      Всё видно в боте в «💰 Зарплата» в любой день месяца.
      Опоздания: от 10 минут — 100 ₽, от 30 — 200 ₽, от часа — 300 ₽. Прогул — 1 000 ₽ и день не оплачивается.
      Новичкам штрафы табеля первый месяц не начисляются.
    questions:
      - {q: "Где увидеть свою зарплату в середине месяца?", a: ["💰 Зарплата в боте", "Только в конце месяца у бухгалтера", "В 1С", "У супервайзера"]}
      - {q: "Прогул — это…", a: ["1 000 ₽ штрафа и день не оплачивается", "Только штраф", "Только день не оплачивается", "Ничего"]}
      - {q: "Опоздание на 15 минут — штраф?", a: ["100 ₽", "200 ₽", "300 ₽", "Без штрафа"]}
