# Анкета клиента demo — вымышленная оптовая фирма для показа. Все имена и цифры выдуманы.
# Данные даёт сидер (clients/demo/seed.py), а не 1С.
# Это же — образец анкеты для настоящего клиента: всё, что ниже, меняется без программиста.

id: demo

company:
  name: "Опт-Партнёр"
  industry: building          # отрасль: building food auto apparel electronics cosmetics pharma household
  timezone: Europe/Moscow

edition: control              # start | business | control (в демо переключается кнопкой)
addons: [stock, logistics, returns]   # модули сверх редакции

work_week:
  weekend: [sun]              # выходные дни: mon tue wed thu fri sat sun
  salary_days: 26             # делитель оклада: оклад ÷ 26 × отработанные дни
  holidays: {}                # доп. выходные: {"2026-11-04": paid} или unpaid

departments:
  - {id: sales,     name: "Отдел продаж", kind: sales}
  - {id: warehouse, name: "Склад",        kind: warehouse}
  - {id: logistics, name: "Логистика",    kind: logistics}
  - {id: purchasing, name: "Закупки",     kind: purchasing}
  - {id: office,    name: "Офис",         kind: office}

# Линии — направления продаж (бренды, юрлица). У простой фирмы — одна.
lines:
  main: {name: "Опт-Партнёр"}

teams:
  - {id: north, name: "Команда Север",     dept: sales, line: main}
  - {id: south, name: "Команда Юг",        dept: sales, line: main}
  - {id: key,   name: "Ключевые клиенты",  dept: sales, line: main}

# Должности: кто в какой роли и по какой схеме получает зарплату
positions:
  - {id: rep,        name: "Торговый представитель", dept: sales,     role: rep,        pay: rep}
  - {id: sv,         name: "Супервайзер",            dept: sales,     role: sv,         pay: sv}
  - {id: rop,        name: "Руководитель продаж",    dept: sales,     role: head,       pay: rop}
  - {id: storekeeper, name: "Кладовщик",             dept: warehouse, role: staff,      pay: warehouse}
  - {id: wh_head,    name: "Заведующий складом",     dept: warehouse, role: head,       pay: salary}
  - {id: driver,     name: "Водитель",               dept: logistics, role: staff,      pay: driver}
  - {id: log_head,   name: "Начальник логистики",    dept: logistics, role: head,       pay: salary}
  - {id: buy_head,   name: "Начальник закупок",      dept: purchasing, role: head,      pay: salary}
  - {id: buyer,      name: "Менеджер по закупкам",   dept: purchasing, role: staff,     pay: salary}
  - {id: accountant, name: "Бухгалтер",              dept: office,    role: accountant, pay: salary}
  - {id: manager,    name: "Офис-менеджер",          dept: office,    role: staff,      pay: salary}
  - {id: director,   name: "Директор",               dept: office,    role: owner,      pay: none}

# Подписи ролей — как их называют в этой компании (необязательно)
roles:
  rep: "Торговый представитель"
  head: "Руководитель отдела"
  owner: "Директор"

# KPI: что считаем и пороги
kpi:
  akb_min: "5 000"            # клиент входит в АКБ, если купил за месяц на эту сумму и больше
  focus_groups: 2             # сколько групп товаров бот берёт в «фокусные» в планах демо
  debt_days: [30, 60]         # пороги просрочки для экранов и тревог; главный — последний
  debt_norm: "10%"            # норма просрочки: выше — красная зона и «собрать до нормы»
  debt_base: 30d              # от чего доля: month — продажи месяца, 30d — продажи за 30 дней, debt — весь долг

# Табель: штрафы за опоздания (минут → ₽) и за прогул
timesheet:
  late: [[10, 100], [30, 200], [60, 300]]
  absent_fine: "1 000"

# Схемы зарплаты — из кубиков. Проценты пишем со знаком: "0,4%", "80%"; суммы как удобно: "25 000".
# Типы кубиков и их настройки — в core/pay/components.py.
pay_schemes:
  rep:
    - {type: salary, amount: "25 000"}
    - {type: sales_percent, rate: "0,4%"}
    - {type: plan_bonus, metric: sales, mode: steps, steps: [["80%", "5 000"], ["100%", "15 000"], ["120%", "20 000"]]}
    - {type: plan_bonus, metric: akb, mode: linear, amount: "5 000", min: "70%", cap: "120%"}
    - {type: plan_bonus, metric: focus, mode: linear, amount: "5 000", min: "80%", cap: "120%"}
    - {type: debt_penalty, days: 60, share: "10%", amount: "3 000"}
    - {type: per_unit, unit: ret_own, rate: "3%", cut: true, name: "Возвраты по своей вине"}
    - {type: timesheet}
  sv:
    - {type: salary, amount: "40 000"}
    - {type: sales_percent, rate: "0,15%", scope: team}
    - {type: plan_bonus, metric: sales, scope: team, mode: steps, steps: [["90%", "10 000"], ["100%", "20 000"]]}
    - {type: debt_bonus, mode: steps, scope: team, steps: [["3%", "5 000"], ["6%", "2 000"]], name: "Бонус: низкая просрочка команды"}
    - {type: timesheet}
  rop:
    - {type: salary, amount: "60 000"}
    - {type: sales_percent, rate: "0,05%", scope: dept}
    - {type: debt_penalty, mode: percent, rate: "1%", max: "10 000", scope: dept, days: 90, name: "Просрочка 90+ отдела"}
    - {type: timesheet}
  warehouse:
    - {type: salary, amount: "35 000"}
    - {type: fixed_bonus, name: "Без ошибок и опозданий", amount: "5 000", cut_per_miss: "1 000"}
    - {type: per_unit, unit: ret_err, price: "500", cut: true, name: "Ошибки склада в возвратах"}
    - {type: timesheet}
  driver:
    - {type: salary, amount: "30 000"}
    - {type: per_unit, unit: km, price: "4"}
    - {type: per_unit, unit: points, price: "25"}
    - {type: fixed_bonus, name: "Без ошибок и пропусков", amount: "5 000", cut_per_miss: "1 000"}
    - {type: per_unit, unit: ret_err, price: "1 000", cut: true, name: "Ошибки при доставке"}
    - {type: timesheet}
  salary:
    - {type: salary}
    - {type: timesheet}
  none: []

# Свои показатели (модуль «Свои формулы KPI»): имя → формула из готовых показателей
formulas:
  avg_check: {name: "Средний чек на клиента", expr: "sales / akb", unit: "₽"}
  collect_rate: {name: "Сбор к продажам", expr: "collect / sales", unit: "%"}

# Тест недели (модуль «Тесты и обучение»): в какой день и во сколько, сколько вопросов, порог «сдал»
quiz: {day: sun, time: "10:00", count: 10, pass: "80%"}

# Склад для закупок: окно скорости продаж, «скоро закончится», «залежалось», на сколько дней заказывать
stock: {window: 60, low_days: 14, stale_days: 90, cover_days: 30}

# Маршрут: во сколько руководителям сводка отчётов дня
route: {close: "21:00"}

# Расписание рассылок (время местное). Пусто — не слать.
schedule:
  morning: "08:00"
  evening: "19:30"

source:
  kind: seed

pay:
  salary: "30 000"            # оклад по умолчанию, если в схеме не указан
