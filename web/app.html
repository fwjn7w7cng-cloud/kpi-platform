/* 🧩 «Собрать бота» одной страницей (Адам 05.11) */

.bt { flex: 1; min-width: 0; } .bt b { display: block; font-size: 15px; } .bt span { display: block; font-size: 12.5px; color: var(--ink-2); }

.bsw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }

/* лёгкая сборка (Адам 09.11): свёрнутые карточки — итог словами, «✏️» раскрывает всё */

.bm { flex: 1; min-width: 0; } .bm b { display: block; font-family: var(--display); font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ===== Оформление (Адам 02.11): 7 стилей + «Классика»; выбор — 🎨 в шапке, хранится на телефоне ===== */
html:root[data-skin] { --bgfx: none; }
html:root[data-skin="glass"] { color-scheme: dark;

  --accent: #E30613; --accent-soft: #FDE7E8; --good: #13804A; --good-soft: #E5F3EB; --warn: #B87A00; --warn-soft: #FBF0D7;

html:root[data-skin="carbon"] { color-scheme: dark;

  --accent: #FF6A00; --accent-soft: rgba(255,106,0,.16); --onacc: #111; --good: #9BEA4B; --good-soft: rgba(155,234,75,.14);
  --warn: #FFD66B; --warn-soft: rgba(255,214,107,.14); --bad: #FF4D4D; --bad-soft: rgba(255,77,77,.15); --muted: #98A2B3; --muted-soft: #2A2D35;
  --ic1: #2A2D35; --ic2: #2A2D35; --ic3: #2A2D35; --ic4: #2A2D35; --ic5: #2A2D35; --ic6: #2A2D35;

/* живые линии — значки кнопок (Адам 02.11) */
.si { width: 1em; height: 1em; display: block; color: var(--icc); overflow: visible; }
.lt .ic .si { width: 25px; height: 25px; } .li .ic .si { width: 19px; height: 19px; }
.tab .i .si { width: 23px; height: 23px; color: var(--ink-2); margin: 0 auto; } .tab.on .i .si { color: var(--accent); }
.role .si { width: 18px; height: 18px; color: currentColor; }
@media (prefers-reduced-motion: no-preference) {
  .si .a-drive { animation: sdrive 1.3s ease-in-out infinite; }
  .si .a-ring { animation: sring 2.6s ease-in-out infinite; transform-origin: 50% 40%; }
  .si .a-jump { animation: sjump 1.9s ease-in-out infinite; }
  .si .a-beat { animation: sbeat 1.4s ease-in-out infinite; transform-origin: 50% 55%; }
  .si .a-lid { animation: slid 2.8s ease-in-out infinite; transform-origin: 20% 40%; }
  .si .a-draw { stroke-dasharray: 40; animation: sdraw 2.6s ease-in-out infinite; }
  .si .a-spin { animation: sspin 6s linear infinite; transform-origin: 12px 12px; }
  .si .a-float { animation: sfloat 2.2s ease-in-out infinite; }
  .si .a-blink { animation: sblink 4s ease-in-out infinite; transform-origin: 50% 50%; }
  .si .a-glow { animation: sglow 2s ease-in-out infinite; }
  .si .a-tilt { animation: stilt 2.4s ease-in-out infinite; transform-origin: 50% 90%; }
}
@keyframes sdrive { 0%,100% { transform: translateX(0); } 50% { transform: translateX(1.6px); } }
@keyframes sring { 0%,78%,100% { transform: rotate(0); } 84% { transform: rotate(-13deg); } 90% { transform: rotate(11deg); } 95% { transform: rotate(-6deg); } }
@keyframes sjump { 0%,100% { transform: translateY(0); } 45%,55% { transform: translateY(-2.6px); } }
@keyframes sbeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.13); } }
@keyframes slid { 0%,70%,100% { transform: rotate(0); } 82% { transform: rotate(-16deg); } }
@keyframes sdraw { 0% { stroke-dashoffset: 40; } 55%,100% { stroke-dashoffset: 0; } }
@keyframes sspin { to { transform: rotate(360deg); } }
@keyframes sfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.8px); } }
@keyframes sblink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes sglow { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes stilt { 0%,80%,100% { transform: rotate(0); } 88% { transform: rotate(-10deg); } 94% { transform: rotate(8deg); } }
.skins .act { display: flex; align-items: center; gap: 12px; text-align: left; }

</style>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const COL = c => c ? " c-" + c : "";
// ===== Живые линии (Адам 02.11): значок кнопки — рисунок, который чуть двигается; нет рисунка — остаётся эмодзи =====

    viewerUrl = URL.createObjectURL(blob);
    if (isPdf && $("vPages")) {                 // наши PDF — страницы-картинки: показываем их, это работает на любом телефоне
      let n = 0; try { n = (await (await fetch(url + "/pages", {credentials: "same-origin"})).json()).n || 0; } catch (x) {}
      $("vPages").innerHTML = n ? Array.from({length: n}, (_, i) => `<img src="${esc(url)}/p${i}" alt="страница ${i + 1}" loading="lazy">`).join("")
        : `<iframe src="${viewerUrl}" title="${esc(name)}" style="width:100%;height:100%;border:0"></iframe>`;
    }
    const sb = $("vShare"); if (!sb) return;
    sb.disabled = false;
    if (navigator.canShare && navigator.canShare({files: [viewerFile]})) {
      sb.textContent = "📤 Поделиться";
      sb.addEventListener("click", () => navigator.share({files: [viewerFile], title: name}).catch(() => {}));
    } else {
      sb.textContent = "⬇️ Скачать";
      sb.addEventListener("click", () => { const a = document.createElement("a"); a.href = viewerUrl; a.download = name; document.body.appendChild(a); a.click(); a.remove(); });
    }
  } catch (e) { closeFile(); toast("Файл устарел — откройте экран заново и нажмите файл ещё раз."); }
}
function closeFile() { const v = $("viewer"); if (v) v.remove(); if (viewerUrl) URL.revokeObjectURL(viewerUrl); viewerFile = viewerUrl = null; }
window.addEventListener("keydown", e => { if (e.key === "Escape") closeFile(); });
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.more) { const max = S.tabs.length > 5 ? 4 : S.tabs.length;
    sheet(`<h2>Ещё</h2>${S.tabs.slice(max).map(([l, to]) => `<button class="act" data-tab="${esc(to)}">${esc(l)}</button>`).join("")}`); return; }
  go(b.dataset.tab, true);
});
// новые сообщения (заявка одобрена, ответ на отзыв) — раз в 30 секунд, пока приложение открыто
setInterval(async () => {
  if (document.hidden || busy) return;
  try {
    const r = await fetch("/api/poll", {credentials: "same-origin"}); const d = await r.json();
    if (d.inbox && d.inbox.length) {
      const box = document.createElement("div"); box.className = "inbox";
      box.innerHTML = d.inbox.map(m => msgHtml(m, false, false)).join("");
      $("main").firstElementChild.prepend(box); toast("🔔 Новое сообщение");
    }
  } catch (e) {}
}, 30000);
const q = new URLSearchParams(location.search);
call("start", {arg: q.get("start") || "", admin: q.get("admin") || ""});
if (q.toString()) history.replaceState(null, "", "/");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
